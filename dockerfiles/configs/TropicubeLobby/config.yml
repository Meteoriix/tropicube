# ============================================================
#  Tropicube Lobby - Configuration
# ============================================================

redis:
  host: "redis"
  port: 6379
  password: "${CFG_REDIS_PASSWORD}"

auto-replay:
  # Nombre de parties automatiques avant une nouvelle confirmation.
  batch-size: 5

lobby:
  welcome:
    # Global switch; each player can disable effects in Profile > Settings.
    enabled: true
  spawn:
    world: "world"
    x: 100
    y: 60
    z: 100
    yaw: 0.0
    pitch: 0.0
  double-jump: true
  join-message: true
  welcome-message: "<tc><gray>Bienvenue <yellow>%player% <gray>! <dark_gray>(<green>%online%<gray>/<red>%max%<dark_gray>)"

guilds:
  # Private menu input expires after this delay (10..600 seconds).
  input-timeout-seconds: 120

# Cosmetic rendering: all values are validated at startup.
cosmetics:
  render-interval-ticks: 5
  particles-per-emission: 2
  range-blocks: 24
  preview-seconds: 5
