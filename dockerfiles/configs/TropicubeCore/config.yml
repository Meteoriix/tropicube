# ============================================================
#  Tropicube Core - Configuration
# ============================================================

# Surcharge possible : TROPICUBE_REDIS_HOST, TROPICUBE_REDIS_PORT, TROPICUBE_REDIS_PASSWORD
redis:
  host: "redis"
  port: 6379
  password: ""

# Surcharge possible : TROPICUBE_DB_HOST, TROPICUBE_DB_PORT, TROPICUBE_DB_NAME,
# TROPICUBE_DB_USER and TROPICUBE_DB_PASSWORD
database:
  host: "mysql"
  port: 3306
  name: tropicube
  user: tropicube
  password: ""

economy:
  currency-name: "TropiCoins"
  currency-symbol: "⚙"
  starting-balance: 100.0
  min-transfer: 1.0
  max-transfer: 1000000.0

language:
  default: "fr"

# ──────────────────────────────────────────────────────────────────────────────
# Ranks — defines all ranks in the network.
# These values ​​are synchronized into the database at each startup
# (INSERT … ON DUPLICATE KEY UPDATE), so changes here apply
# we reboot. Changes made via /tropiperm grade in game are
# overwritten on the next reboot.
# ──────────────────────────────────────────────────────────────────────────────
grades:
  JOUEUR:
    display-name: "Joueur"
    prefix: "<gray><bold>JOUEUR</bold></gray> "
    suffix: ""
    color: "<white>"
    priority: 0
    is-vip: false
    is-staff: false
    permissions: []
  VIP:
    display-name: "VIP"
    prefix: "<green><bold>VIP</bold></green> "
    suffix: ""
    color: "<green>"
    priority: 10
    is-vip: true
    is-staff: false
    permissions:
      - tropicube.vip
      - tropicube.kit.vip
      - tropicube.lobby.jump
  VIP_PLUS:
    display-name: "VIP+"
    prefix: "<gold><bold>VIP+</bold></gold> "
    suffix: ""
    color: "<gold>"
    priority: 20
    is-vip: true
    is-staff: false
    permissions:
      - tropicube.vip
      - tropicube.vip.plus
      - tropicube.kit.vip_plus
      - tropicube.lobby.jump.double
  PREMIUM:
    display-name: "Premium"
    prefix: "<light_purple><bold>PREMIUM</bold></light_purple> "
    suffix: ""
    color: "<light_purple>"
    priority: 30
    is-vip: true
    is-staff: false
    permissions:
      - tropicube.vip
      - tropicube.premium
      - tropicube.kit.premium
      - tropicube.lobby.infinitejump
      - tropicube.announce.join
  HELPER:
    display-name: "Helper"
    prefix: "<aqua><bold>HELPER</bold></aqua> "
    suffix: ""
    color: "<aqua>"
    priority: 50
    is-vip: false
    is-staff: true
    permissions:
      - tropicube.staff
      - tropicube.helper
      - tropicube.mute
      - tropicube.kick
      - tropicube.lobby.infinitejump
      - tropicube.announce.join
  MODERATEUR:
    display-name: "Modérateur"
    prefix: "<dark_aqua><bold>MODO</bold></dark_aqua> "
    suffix: ""
    color: "<dark_aqua>"
    priority: 60
    is-vip: false
    is-staff: true
    permissions:
      - tropicube.staff
      - tropicube.moderateur
      - tropicube.mute
      - tropicube.kick
      - tropicube.warn
      - tropicube.ban
      - tropicube.lobby.infinitejump
      - tropicube.announce.join
  ADMIN:
    display-name: "Administrateur"
    prefix: "<red><bold>ADMIN</bold></red> "
    suffix: ""
    color: "<red>"
    priority: 80
    is-vip: false
    is-staff: true
    permissions:
      - tropicube.admin
      - tropicube.staff
      - tropicube.*
  OWNER:
    display-name: "Propriétaire"
    prefix: "<dark_red><bold>OWNER</bold></dark_red> "
    suffix: ""
    color: "<dark_red>"
    priority: 100
    is-vip: false
    is-staff: true
    permissions:
      - "*"
