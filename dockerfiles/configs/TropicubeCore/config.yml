# ============================================================
#  Tropicube Core - Configuration
# ============================================================

# Surcharge possible : TROPICUBE_REDIS_HOST, TROPICUBE_REDIS_PORT, TROPICUBE_REDIS_PASSWORD
redis:
  pool:
    max-total: 20
    max-idle: 10
    min-idle: 2
  connect-timeout-millis: 2000
  socket-timeout-millis: 2000
  borrow-timeout-millis: 2000
  host: "redis"
  port: 6379
  password: ""

# Surcharge possible : TROPICUBE_DB_HOST, TROPICUBE_DB_PORT, TROPICUBE_DB_NAME,
# TROPICUBE_DB_USER and TROPICUBE_DB_PASSWORD
database:
  pool:
    max-size: 10
    min-idle: 2
  connection-timeout-millis: 30000
  socket-timeout-millis: 30000
  max-concurrent: 10
  queue-capacity: 100
  shutdown-timeout-seconds: 10
  host: "mysql"
  port: 3306
  name: tropicube
  user: tropicube
  password: ""

economy:
  currency-name: "TropiCoins"
  currency-symbol: "⚙"
  starting-balance: 100.0
  min-transfer: 1.0
  max-transfer: 1000000.0

# Network-wide social features. Friendships are persistent in MySQL while
# parties and their short-lived invitations are stored in Redis.
social:
  friends:
    max-count: 100
    request-expiry-days: 30
  party:
    max-size: 8
    invite-expiry-seconds: 60

guilds:
  max-members: 50
  max-officers: 5
  weekly-contribution-cap: 5000

language:
  default: "fr"

# ──────────────────────────────────────────────────────────────────────────────
# Cosmetic grades and their default access levels. Applying a grade always
# replaces the player's current vipLevel and modLevel with these defaults.
# ──────────────────────────────────────────────────────────────────────────────
grades:
  JOUEUR:
    display-name: "Joueur"
    prefix: "<gray><bold>JOUEUR</bold></gray> "
    suffix: ""
    color: "<white>"
    priority: 0
    default-vip-level: 0
    default-mod-level: 0
  VIP:
    display-name: "VIP"
    prefix: "<green><bold>VIP</bold></green> "
    suffix: ""
    color: "<green>"
    priority: 10
    default-vip-level: 1
    default-mod-level: 0
  VIP_PLUS:
    display-name: "VIP+"
    prefix: "<gold><bold>VIP+</bold></gold> "
    suffix: ""
    color: "<gold>"
    priority: 20
    default-vip-level: 2
    default-mod-level: 0
  PREMIUM:
    display-name: "Premium"
    prefix: "<light_purple><bold>PREMIUM</bold></light_purple> "
    suffix: ""
    color: "<light_purple>"
    priority: 30
    default-vip-level: 3
    default-mod-level: 0
  HELPER:
    display-name: "Helper"
    prefix: "<aqua><bold>HELPER</bold></aqua> "
    suffix: ""
    color: "<aqua>"
    priority: 50
    default-vip-level: 3
    default-mod-level: 1
  MODERATEUR:
    display-name: "Modérateur"
    prefix: "<dark_aqua><bold>MODO</bold></dark_aqua> "
    suffix: ""
    color: "<dark_aqua>"
    priority: 60
    default-vip-level: 3
    default-mod-level: 2
  ADMIN:
    display-name: "Administrateur"
    prefix: "<red><bold>ADMIN</bold></red> "
    suffix: ""
    color: "<red>"
    priority: 80
    default-vip-level: 3
    default-mod-level: 3
  OWNER:
    display-name: "Propriétaire"
    prefix: "<dark_red><bold>OWNER</bold></dark_red> "
    suffix: ""
    color: "<dark_red>"
    priority: 100
    default-vip-level: 3
    default-mod-level: 4

access:
  audit-retention-days: 365
  permission-thresholds:
    vip:
      "tropicube.lobby.jump": 1
      "tropicube.lobby.jump.double": 2
      "tropicube.custom-game.create": 2
      "tropicube.queue.priority": 2
      "sheepwars.mapvote.weight.2": 2
      "tropicube.lobby.infinitejump": 3
      "tropicube.announce.join": 3
      "tropicube.nick": 3
    mod:
      "tropicube.staff": 1
      "tropicube.mute": 1
      "tropicube.kick": 1
      "tropicube.warn": 2
      "tropicube.ban": 2
      "tropicube.history": 2
      "tropicube.reports.manage": 2
