# =====================================================
#   Tropicube Velocity - Configuration principale
# =====================================================

redis:
  host: "redis"
  port: 6379
  password: "${CFG_REDIS_PASSWORD}"

language:
  default: "fr"

party:
  # Offline members are removed after this grace period; leadership is then transferred to an online member.
  # A party with no online member is deleted immediately.
  disconnect-grace-seconds: 60

# Adaptive protection applied before authentication. It stores only short-lived
# counters and quarantines; no address/account history is persisted.
connection-protection:
  address-limit: 8
  global-limit: 120
  window-seconds: 10
  quarantine-seconds: 30

maintenance:
  default-deadline-minutes: 30

motd:
  line-1: "<gold><bold>Tropicube</bold></gold> <gray>•</gray> <aqua>Des cubes, du soleil et de l’aventure !</aqua>"
  line-2: "<yellow>{games}</yellow>"
  games-separator: " <dark_gray>•</dark_gray> "
  no-games: "<gray>De nouveaux jeux arrivent bientôt</gray>"
  game-SHEEPWARS: "SheepWars"
  maintenance-line: "<red>Maintenance en cours</red>"

announcements:
  interval-seconds: 300
  entries:
    - message-key: "proxy.announcement-welcome"
      target: "network"

# Deletes dynamic servers and their managed ephemeral data volumes when the proxy is stopped.
# Set to false only to preserve games during a Velocity redeploy.
shutdown:
  stop-dynamic-servers: true

health-check:
  # A ready instance is polled frequently and purged after a minute without success.
  interval-seconds: 10
  stale-timeout-seconds: 60
  connect-timeout-millis: 2000

docker:
  host: "tcp://docker-proxy:2375"
  network: "tropicube-net"
  container-prefix: "tropicube"
  port-range-start: 25600
  port-range-end: 25700
  rcon-port-range-start: 25701
  rcon-port-range-end: 25801
  rcon-password: "${CFG_RCON_PASSWORD}"
  # Absolute path of the project on the Docker host (used to resolve relative volumes)
  base-path: ""

admin-uuids:
  - "bcc80c2b-98ca-4b6c-b21b-33cf85e41228" # Meteoriix
  - "7f72f5e5-72ba-4a2f-99fc-d5a204c1b9da" # OloWak
  - "62a69a13-11bc-4b74-9c19-5d0a5253af2d" # Flashoune

# =====================================================
# Nick system (/nick)
# skin-uuids: Additional Mojang UUIDs used
# as a random skin source (without dashes or with).
# Notch, jeb_ and Dinnerbone are included by default.
# =====================================================
nick:
  # Ranks allowed to use /nick (staff ranks are included explicitly).
  allowed-grades: ["PREMIUM", "HELPER", "MODERATEUR", "ADMIN", "OWNER"]
  # Additional Mojang UUIDs for the random skin pool.
  skin-uuids:
    - "96ac1c5a-de96-4556-9763-46011a868496"
    - "2398bc2f-6915-4048-8b48-999cdd4b1cb2"
    - "2fa3096f-7c7a-4a7e-bc44-5de7d61bbef4"
    - "bbfc1ab2-f8b6-450d-ad6e-2a1169de59fb"

# =====================================================
# Server templates
#  type: LOBBY | SHEEPWARS ...
#
# Variables injected AUTOMATICALLY by DockerManager
# (do not redefine them here except for intentional override):
#    EULA, SERVER_NAME, INSTANCE_ID,
# MAX_PLAYERS ← from max-players
# MEMORY ← from ram-min (ex. "1024M")
# MAX_MEMORY ← from ram-max (e.g. "2048M")
# ENABLE_RCON, RCON_PORT, RCON_PASSWORD ← from docker.rcon-*
# =====================================================
matchmaking:
  ranked:
    initial-rating-range: 75
    growth-per-step: 25
    step-seconds: 15
    maximum-rating-range: 500

templates:

  lobby:
    enabled: true  # Toujours forcé à true par le serveur — le lobby ne peut pas être désactivé.
    name: "Lobby"
    image: "tropicube-lobby:latest"
    type: "LOBBY"
    port-min: 25600
    port-max: 25624
    max-players: 100
    ram-min: 1024
    ram-max: 2048
    auto-start: true
    # Empty instances automatically stop after auto-stop-delay seconds.
    auto-stop: true
    auto-stop-delay: 300
    min-instances: 1
    max-instances: 5
    environment:
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "97"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      # Disable online mode: Velocity manages authentication (modern forwarding).
      ONLINE_MODE: "false"
      # Necessary for double-jumping to work (the server allows paper-side flight).
      ALLOW_FLIGHT: "true"
      # Reapply env vars on server.properties on every startup.
      OVERRIDE_SERVER_PROPERTIES: "true"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      SYNC_CHUNK_WRITES: "false"
      TZ: "Europe/Paris"
      REPLACE_ENV_VARIABLES: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET}"
      TROPICUBE_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      TROPICUBE_DB_NAME: "${MYSQL_DATABASE}"
      TROPICUBE_DB_USER: "${MYSQL_USER}"
      TROPICUBE_DB_PASSWORD: "${MYSQL_PASSWORD}"
      TROPICUBE_TOTP_MASTER_KEY: "${TOTP_MASTER_KEY}"
      OPS: |
        Meteoriix
        OloWak
        Flashoune

  sheepwars:
    enabled: true
    name: "Sheepwars"
    image: "tropicube-sheepwars:latest"
    type: "SHEEPWARS"
    port-min: 25625
    port-max: 25639
    max-players: 16
    spectator-slots: 8
    ram-min: 1024
    ram-max: 2048
    auto-start: true
    # Empty instances automatically stop after auto-stop-delay seconds.
    auto-stop: true
    auto-stop-delay: 300
    min-instances: 1
    max-instances: 5
    environment:
      GAME_MODE: "QUICK_PLAY"
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "97"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      # Disable online mode: Velocity manages authentication (modern forwarding).
      ONLINE_MODE: "false"
      # Reapply env vars on server.properties on every startup.
      OVERRIDE_SERVER_PROPERTIES: "true"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "5"
      SYNC_CHUNK_WRITES: "false"
      TZ: "Europe/Paris"
      REPLACE_ENV_VARIABLES: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET}"
      TROPICUBE_REDIS_PASSWORD: "${REDIS_PASSWORD}"
      TROPICUBE_DB_NAME: "${MYSQL_DATABASE}"
      TROPICUBE_DB_USER: "${MYSQL_USER}"
      TROPICUBE_DB_PASSWORD: "${MYSQL_PASSWORD}"
      TROPICUBE_TOTP_MASTER_KEY: "${TOTP_MASTER_KEY}"
      OPS: |
        Meteoriix
        OloWak
        Flashoune

  sheepwars-ranked-4v4:
    enabled: true
    name: "Sheepwars Ranked 4v4"
    image: "tropicube-sheepwars:latest"
    type: "SHEEPWARS"
    port-min: 25640
    port-max: 25649
    max-players: 8
    spectator-slots: 4
    ram-min: 1024
    ram-max: 2048
    auto-start: false
    auto-stop: true
    auto-stop-delay: 300
    min-instances: 0
    max-instances: 3
    environment:
      GAME_MODE: "RANKED_4V4"
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "97"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      ONLINE_MODE: "false"
      OVERRIDE_SERVER_PROPERTIES: "true"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "5"
      SYNC_CHUNK_WRITES: "false"
      TZ: "Europe/Paris"

  sheepwars-ranked-8v8:
    enabled: true
    name: "Sheepwars Ranked 8v8"
    image: "tropicube-sheepwars:latest"
    type: "SHEEPWARS"
    port-min: 25650
    port-max: 25659
    max-players: 16
    spectator-slots: 8
    ram-min: 1024
    ram-max: 2048
    auto-start: false
    auto-stop: true
    auto-stop-delay: 300
    min-instances: 0
    max-instances: 3
    environment:
      GAME_MODE: "RANKED_8V8"
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "97"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      ONLINE_MODE: "false"
      OVERRIDE_SERVER_PROPERTIES: "true"
      USE_AIKAR_FLAGS: "true"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "5"
      SYNC_CHUNK_WRITES: "false"
      TZ: "Europe/Paris"
