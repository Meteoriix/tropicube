name: Isolated image lot smoke test

on:
  workflow_dispatch:
    inputs:
      image_lot:
        description: Verified local image lot (YYYYMMDD-HHMMSS) on the staging runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tropicube-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, tropicube-staging]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Boot and stop isolated Velocity and Paper backends
        env:
          IMAGE_LOT: ${{ inputs.image_lot }}
        run: python3 tools/ops/smoke_test.py "$IMAGE_LOT"
