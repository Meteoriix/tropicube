name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Test operations failure paths
        run: python -m unittest discover -s tools/ops -p test_ops.py -v

      - name: Integration tests with disposable MySQL and Redis
        run: python tools/ops/integration_tests.py

      - name: Check Maven wrapper
        run: bash ./mvnw --version

      - name: Build and run automated tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Test language editor backend
        run: bash ./mvnw --batch-mode --no-transfer-progress -f tools/language-editor/backend/pom.xml verify

      - name: Test and build language editor interface
        run: |
          npm --prefix tools/language-editor/frontend ci
          npm --prefix tools/language-editor/frontend test
          npm --prefix tools/language-editor/frontend run build

      - name: Rebuild and validate documentation site
        run: |
          node docs-site/build.mjs
          node docs-site/validate.mjs
          git diff --exit-code -- docs-site

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Check Bash deployment script syntax
        run: |
          bash -n deploy.sh
          bash -n language-editor.sh

      - name: Check PowerShell deployment script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @('./deploy.ps1', './language-editor.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
          }

  windows:
    name: Native Windows validation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build reactor with Windows wrapper
        shell: pwsh
        run: ./mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Test operations on Windows
        run: python -m unittest discover -s tools/ops -p test_ops.py -v
      - name: Parse native deployment scripts
        shell: pwsh
        run: |
          foreach ($file in @('deploy.ps1', 'language-editor.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
