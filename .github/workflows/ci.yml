name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check Maven wrapper
        run: bash ./mvnw --version

      - name: Build and run automated tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Rebuild and validate documentation site
        run: |
          node docs-site/build.mjs
          node docs-site/validate.mjs
          git diff --exit-code -- docs-site

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Check Bash deployment script syntax
        run: bash -n deploy.sh

      - name: Check PowerShell deployment script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './deploy.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
