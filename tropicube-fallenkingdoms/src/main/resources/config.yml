game:
  auto-start: true
  default-map: cactus
  countdown-seconds: 30
  result-display-seconds: 10
  min-players-per-kingdom: 4
  max-players-per-kingdom: 6
  max-kingdoms: 5
phases:
  pvp-at-seconds: 900
  assault-at-seconds: 1500
  sudden-death-at-seconds: 4500
  force-end-at-seconds: 5400
hearts:
  max-health: 500.0
  tnt-direct-damage: false
respawn:
  delay-seconds: 10
  drop-inventory: true
  reissue-kit: false
  disconnect-counts-as-death: true
sudden-death:
  final-border-size: 50.0
ruins:
  waves: 3
  ticks-between-waves: 10
  radius: 8.0
  destruction-ratio: 0.35
  preserve-containers: true
combat:
  default-profile: PAPER_26_2
  allowed-custom-profiles: [PAPER_26_2, LEGACY_1_8]
  friendly-fire: false
protections:
  forbidden-base-materials: [OBSIDIAN, BEDROCK]
  common-placement-whitelist: [COBBLESTONE, OAK_PLANKS, LADDER, TORCH]
  tnt-breaches-enabled: true
  block-portal-bypass: true
  block-teleport-bypass: true
  block-piston-crossing: true
  block-fluid-crossing: true
kits:
  default: miner
  definitions:
    miner:
      enabled: true
      icon: IRON_PICKAXE
      items:
        - { material: STONE_PICKAXE, amount: 1, slot: 0, enchantments: { efficiency: 1 } }
        - { material: IRON_PICKAXE, amount: 1, slot: 1, damage: 125, enchantments: { efficiency: 1 } }
    farmer:
      enabled: true
      icon: WHEAT
      items:
        - { material: BONE_MEAL, amount: 16, slot: 0 }
        - { material: WOODEN_SWORD, amount: 1, slot: 1, damage: 25, enchantments: { looting: 3, fire_aspect: 1 } }
    scout:
      enabled: true
      icon: FEATHER
      items:
        - { material: POTION, potion-type: SWIFTNESS, amount: 1, slot: 0 }
        - { material: POTION, potion-type: STRONG_SWIFTNESS, amount: 1, slot: 1 }
        - { material: POTION, potion-type: LONG_SWIFTNESS, amount: 1, slot: 2 }
        - { material: SPLASH_POTION, potion-type: STRONG_SWIFTNESS, amount: 1, slot: 3 }
        - { material: SPLASH_POTION, potion-type: LONG_SWIFTNESS, amount: 1, slot: 4 }
    enchanter:
      enabled: true
      icon: ENCHANTING_TABLE
      items:
        - { material: EXPERIENCE_BOTTLE, amount: 64, slot: 0 }
        - { material: EXPERIENCE_BOTTLE, amount: 64, slot: 1 }
        - { material: ANVIL, amount: 1, slot: 2 }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 3, enchantments: { sharpness: 1 } }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 4, enchantments: { sharpness: 2 } }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 5, enchantments: { protection: 1 } }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 6, enchantments: { protection: 2 } }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 7, enchantments: { thorns: 1 } }
        - { material: ENCHANTED_BOOK, amount: 1, slot: 8, enchantments: { knockback: 2 } }
