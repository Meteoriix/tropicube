# ============================================================
#  Tropicube Lobby - Configuration
# ============================================================

redis:
  host: localhost
  port: 6379
  password: ""          # Laisser vide si pas de mot de passe

auto-replay:
  # Number of games played automatically before asking the player to confirm again.
  batch-size: 5

lobby:
  welcome:
    # Master switch. Players can additionally disable these effects in Profile > Settings.
    enabled: true
  # Spawn position in lobby world
  spawn:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

# Master switch for double jump in the lobby.
  # The number of jumps granted depends on the player's permissions:
#   tropicube.lobby.jump        → 1 jump
#   tropicube.lobby.jump.double → 2 jumps
  # tropicube.lobby.infinitejump → unlimited jumps
  # Setting this to false disables the feature for everyone.
  double-jump: true

# ──────────────────────────────────────────────────────────────────────────────
# Server Types — icon displayed in the game mode switcher.
# Use either material (Material Bukkit name) or head-id (HeadDatabase).
# ──────────────────────────────────────────────────────────────────────────────
server-types:
  hub:
    material: COMPASS
  sheepwars:
    head-id: "79740"
  fallenkingdoms:
    material: END_CRYSTAL

# ──────────────────────────────────────────────────────────────────────────────
# VIP Shop — entries displayed in the /vip menu.
# grade-key: name of the grade in the database (e.g. VIP, VIP_PLUS, PREMIUM).
# material: Material Bukkit for the main icon.
# display-name: MiniMessage name displayed in menu and messages.
# price: cost in game currency.
# The perks are read in the language files:
# lobby.vip-perks-<lowercase-hyphenated-grade-key>
# ──────────────────────────────────────────────────────────────────────────────
vip-shop:
  entries:
    - grade-key: "VIP"
      material: EMERALD
      display-name: "<green><bold>VIP</bold></green>"
      price: 5000
    - grade-key: "VIP_PLUS"
      material: EMERALD_BLOCK
      display-name: "<gold><bold>VIP+</bold></gold>"
      price: 15000
    - grade-key: "PREMIUM"
      material: DIAMOND
      display-name: "<light_purple><bold>PREMIUM</bold></light_purple>"
      price: 40000

# ──────────────────────────────────────────────────────────────────────────────
# Language selector — icons and labels displayed in the /lang menu.
# head-id: HeadDatabase identifier of the player head to display.
# display-name / lore : texte MiniMessage ; utiliser <br> pour séparer les lignes du lore.
# The order of the list determines the order of display in the menu.
# ──────────────────────────────────────────────────────────────────────────────
lang-selector:
  languages:
    - code: "fr"
      head-id: "51737"
      display-name: "<white>Français"
      lore: "<blue>■<white>■<red>■ <dark_gray>FR <gray>— <aqua>Français<br><gray>Cliquez pour jouer en français."
    - code: "en"
      head-id: "55849"
      display-name: "<white>English"
      lore: "<dark_blue>■<white>■<red>■ <dark_gray>EN <gray>— <aqua>English<br><gray>Click to play in English."
    - code: "es"
      head-id: "58336"
      display-name: "<white>Español"
      lore: "<red>■<yellow>■<red>■ <dark_gray>ES <gray>— <aqua>Español<br><gray>Haz clic para jugar en español."
    - code: "de"
      head-id: "522"
      display-name: "<white>Deutsch"
      lore: "<dark_gray>■<red>■<yellow>■ <dark_gray>DE <gray>— <aqua>Deutsch<br><gray>Klicken Sie, um auf Deutsch zu spielen."

guilds:
  # Private menu input expires after this delay (10..600 seconds).
  input-timeout-seconds: 120

# Cosmetic rendering: all values are validated at startup.
cosmetics:
  render-interval-ticks: 5
  particles-per-emission: 2
  range-blocks: 24
  preview-seconds: 5
