name: TropicubeLobby
version: 1.0.0
main: fr.tropicube.lobby.TropicubeLobby
api-version: '26.3'
description: "Tropicube - Plugin Lobby avec menus GUI, sélecteur de serveurs et boutique VIP"
authors: [ Tropicube-Team ]

depend:
  - TropicubeCore

softdepend: []

commands:
  spawn:
    description: "Retourne au spawn du lobby"
    usage: /spawn
  play:
    description: "Ouvre le sélecteur de serveurs"
    usage: /play
    aliases: [ servers, sv ]
  languages:
    description: "Ouvre le sélecteur de langue"
    usage: /languages
  vip:
    description: "Ouvre la boutique VIP"
    usage: /vip
    aliases: [ boutique, shop ]
  fly:
    description: "Bascule entre vol permanent et double-saut infini (staff)"
    usage: /fly
    permission: tropicube.lobby.fly
    aliases: [ flymode, fm ]
  replay:
    description: "Rejoins la prochaine partie disponible du dernier mini-jeu joué"
    usage: /replay
    aliases: [ playnext, playagain, rejouer ]
  replayconfirm:
    description: "Confirme cinq nouvelles parties avec rejeu automatique"
    usage: /replayconfirm
  rejoin:
    description: "Rejoint une partie SheepWars quittée mais toujours active"
    usage: /rejoin
  quickplay:
    description: "Rejoint le SheepWars Quick Play"
    usage: /quickplay
  competitive:
    description: "Rejoint une file SheepWars classée"
    usage: /competitive <4v4|8v8>

permissions:
  tropicube.lobby.build:
    description: "Permet de construire dans le lobby"
    default: false
  tropicube.lobby.drop:
    description: "Permet de poser des items dans le lobby"
    default: false
  tropicube.lobby.pickup:
    description: "Permet de ramasser des items dans le lobby"
    default: false
  tropicube.lobby.fly:
    description: "Vol permanent dans le lobby"
    default: false
  tropicube.lobby.jump:
    description: "Double saut (1 saut) dans le lobby — VIP"
    default: false
  tropicube.lobby.jump.double:
    description: "Double saut (2 sauts) dans le lobby — VIP+"
    default: false
  tropicube.lobby.infinitejump:
    description: "Double saut infini dans le lobby — Premium+"
    default: false
