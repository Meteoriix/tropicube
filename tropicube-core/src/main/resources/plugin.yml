name: TropicubeCore
version: 1.0.0
main: fr.tropicube.core.TropicubeCore
api-version: '26.2'
description: "Tropicube - Plugin Core : économie, permissions, langues, modération"
authors: [ Tropicube-Team ]

depend:
  - HeadDatabase

commands:
  money:
    description: "Voir votre solde"
    usage: /money
    aliases: [ balance ]
  eco:
    description: "Administration de l'économie"
    usage: /eco <set|add|remove|top> [joueur] [montant]
    permission: tropicube.eco.admin
  rank:
    description: "Gérer les grades des joueurs"
    usage: /rank <set|info|list> [joueur] [rank]
    permission: tropicube.grade.admin
    aliases: [ grade ]
  lang:
    description: "Changer la langue du serveur"
    usage: /lang [code]
    aliases: [ language, langue ]
  mute:
    description: "Muter un joueur"
    usage: /mute <joueur> <durée> [raison]
    permission: tropicube.mute
  unmute:
    description: "Démuter un joueur"
    usage: /unmute <joueur>
    permission: tropicube.mute
  kick:
    description: "Expulser un joueur"
    usage: /kick <joueur> [raison]
    permission: tropicube.kick
  warn:
    description: "Avertir un joueur"
    usage: /warn <joueur> <raison>
    permission: tropicube.warn
  history:
    description: "Voir l'historique de sanctions d'un joueur"
    usage: /history <joueur>
    permission: tropicube.history
  ban:
    description: "Bannir définitivement un joueur du réseau"
    usage: /ban <joueur> [raison]
    permission: tropicube.ban
  tempban:
    description: "Bannir temporairement un joueur du réseau"
    usage: /tempban <joueur> <durée> [raison]
    permission: tropicube.ban
  unban:
    description: "Lever un bannissement réseau"
    usage: /unban <joueur>
    permission: tropicube.ban
  report:
    description: "Signaler un joueur"
    usage: /report <joueur> <chat|cheat|behavior|other> [#message] [détails]
  reports:
    description: "Gérer la file de signalements"
    usage: /reports <list|claim|resolve> ...
    permission: tropicube.reports.manage
  msg:
    description: "Envoyer un message privé interserveurs"
    usage: /msg <joueur> <message>
    aliases: [ tell, w ]
  reply:
    description: "Répondre au dernier message privé"
    usage: /reply <message>
    aliases: [ r ]
  ignore:
    description: "Bloquer ou débloquer un joueur"
    usage: /ignore <joueur>
  globalchat:
    description: "Écrire explicitement dans le chat global"
    usage: /globalchat <message>
    aliases: [ g ]
  2fa:
    description: "Valider une session staff avec TOTP"
    usage: /2fa <issue|enroll|confirm|verify|status>
  staff:
    description: "Activer le mode staff invisible contrôlé"
    usage: /staff
    permission: tropicube.staff
  staffchat:
    description: "Écrire dans le chat staff interserveurs"
    usage: /staffchat <message>
    aliases: [ sc ]
    permission: tropicube.staff
  profile:
    description: "Afficher un profil réseau"
    usage: /profile [joueur]
    aliases: [ profil ]
  settings:
    description: "Gérer les préférences persistantes"
    usage: /settings <profile|messages|global|entities|hints> <valeur>
    aliases: [ preferences, parametres ]
  missions:
    description: "Afficher, relancer et réclamer les missions"
    usage: /missions [reroll|claim] ...
  notifications:
    description: "Ouvrir le centre de notifications"
    usage: /notifications [read <id>]
    aliases: [ inbox ]
  center:
    description: "Ouvrir le centre joueur"
    usage: /center
    aliases: [ centre ]
  privacy:
    description: "Exporter ou anonymiser les données d'un joueur"
    usage: /privacy <export|erase|status|cancel> ...
    permission: tropicube.privacy.manage
  guild:
    description: "Créer et gérer une guilde"
    usage: /guild <info|create|invite|accept|leave|kick|promote|demote|transfer>
    aliases: [ guilde ]
  permissions:
    description: "Gérer les permissions individuelles"
    usage: /permissions <add|remove|list|grade> ...
    permission: tropicube.admin.perm
    aliases: [ tropiperm ]
  coreadmin:
    description: "Administration générale Tropicube"
    usage: /coreadmin <reload|info>
    permission: tropicube.admin
    aliases: [ tropiadmin, ca ]
  help:
    description: "Affiche les commandes Tropicube disponibles"
    usage: /help [general|games|profile|staff]
  friend:
    description: "Gérer ses amis Tropicube"
    usage: /friend <add|accept|deny|remove|list|requests|join> ...
    aliases: [ friends, ami, amis ]
  party:
    description: "Gérer son groupe Tropicube"
    usage: /party <invite|accept|deny|list|leave|kick|promote|follow|warp|chat> ...
    aliases: [ groupe ]
  pc:
    description: "Écrire dans le chat de groupe"
    usage: /pc <message>

permissions:
  tropicube.admin:
    description: "Accès aux commandes d'administration"
    default: op
  tropicube.eco.admin:
    description: "Administration de l'économie"
    default: op
  tropicube.grade.admin:
    description: "Gérer les grades"
    default: op
  tropicube.admin.perm:
    description: "Gérer les permissions individuelles"
    default: op
  tropicube.mute:
    description: "Muter des joueurs"
    default: op
  tropicube.kick:
    description: "Expulser des joueurs"
    default: op
  tropicube.warn:
    description: "Avertir des joueurs"
    default: op
  tropicube.ban:
    description: "Bannir des joueurs"
    default: op
  tropicube.history:
    description: "Voir l'historique de sanctions"
    default: op
  tropicube.reports.manage:
    description: "Consulter et traiter les signalements"
    default: op
  tropicube.moderation.chat-evidence:
    description: "Afficher les identifiants cliquables des messages"
    default: op
  tropicube.privacy.manage:
    description: "Gérer les demandes relatives aux données personnelles"
    default: op
  tropicube.2fa.issue:
    description: "Émettre un jeton d'inscription TOTP"
    default: op
  tropicube.missions.reroll.bonus:
    description: "Accorde deux rerolls quotidiens supplémentaires"
    default: false
  tropicube.bypass.whitelist:
    description: "Bypasser la whitelist"
    default: op
  tropicube.bypass.spam:
    description: "Bypasser l'anti-spam chat"
    default: op
  tropicube.chat.color:
    description: "Utiliser des couleurs dans le chat"
    default: false
  tropicube.vip:
    description: "Accès aux fonctionnalités VIP"
    default: false
  tropicube.premium:
    description: "Accès aux fonctionnalités Premium"
    default: false
  tropicube.staff:
    description: "Identification comme membre du staff"
    default: false
