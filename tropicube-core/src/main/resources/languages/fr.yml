  unmute-usage: "<tc><red>Usage : /unmute \\<joueur>"
  history-usage: "<tc><red>Usage : /history \\<joueur>"
  grade-usage: "<tc><red>Usage : /rank \\<set|info|list> [joueur] [grade] [secondes]"
  grade-set-usage: "<tc><red>Usage : /rank set \\<joueur> \\<grade> [secondes]"
  grade-info-usage: "<tc><red>Usage : /rank info \\<joueur>"
  tropiadmin-usage: "<tc><red>Usage : /tropiadmin \\<reload|info>"
  tropiadmin-reloaded: "<tc><green>Tropicube rechargé !"
  tropiadmin-info-header: "<tc><gold><bold>Tropicube Core</bold></gold>"
  tropiadmin-info-players: "<gray>Joueurs en ligne: <white>{tropiadmin_info_players}"
  tropiadmin-info-db: "<gray>DB connectée: <white>{tropiadmin_info_db}"
