# General
general:
  no-permission: "<tc><red>Oups ! Tu n'as pas la permission de faire ça. 🚫"
  player-only: "<tc><red>Cette commande est réservée aux joueurs."
  player-not-found: "<tc><red>Joueur introuvable : <white>{player_not_found}"
  invalid-number: "<tc><red>Nombre invalide."
