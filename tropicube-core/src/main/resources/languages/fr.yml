# Connexion
join:
  message: "<green>🌴</green> <yellow>{message}</yellow> <gray>a rejoint Tropicube</gray>"
  first-join: "<gold>☀</gold> <yellow>{first_join}</yellow> <gray>débarque pour la première fois sur Tropicube !</gray>"
  welcome-back: "<aqua>🌊</aqua> <gray>Content de te revoir, <white>{welcome_back}</white> !</gray>"

# Economy
economy:
  balance: "<tc><gray>Tes <gold>⬡<gray> : <gold>{balance} 💰"
  balance-other: "<tc><gray>Solde de <white>{player}<gray> : <gold>{balance}"
  pay-success: "<tc><green>Tu as envoyé <gold>{amount} <green>à <white>{player}<green> ! 💸"
  pay-error-funds: "<tc><red>Fonds insuffisants ! Il te reste <gold>{pay_error_funds}<red>. 💸"
  admin-set: "<tc><green>Balance de <white>{player} <green>définie à <gold>{amount}<green>."
  admin-add: "<tc><gold>{amount} <green>ajoutés au compte de <white>{player}<green>."
  admin-remove: "<tc><gold>{amount} <green>retirés du compte de <white>{player}<green>."
  top-header: "<tc><gold><bold>Classement Richesse</bold></gold>"
  top-entry: "  <gray>#{rank} <white>{player} <dark_gray>— <gold>{balance}"
  invalid-action: "<tc><red>Action invalide. Usage : set|add|remove|top"

# Grades
grade:
  set-success: "<tc><green>Grade de <white>{player} <green>défini à <reset>{grade}<green>."
  set-self: "<tc><green>Ton grade est maintenant <reset>{set_self}<green>. Félicitations Champion ! 🏆"
  list-header: "<tc><gold><bold>Grades disponibles</bold></gold>"
  list-entry: "  {prefix}<white>{grade} <dark_gray>(priorité: <gray>{priority}<dark_gray>)"
  invalid: "<tc><red>Grade invalide : <white>{invalid}"
  no-downgrade: "<tc><red>Tu ne peux pas changer le grade d'un joueur de rang supérieur."

# Langues
language:
  header: "<tc><gold><bold>Choisis ta langue 🌐</bold></gold>"
  selected: "<tc><green>Langue définie : <white>{selected}"
  invalid: "<tc><red>Langue invalide. Langues disponibles : <white>{invalid}"
  current: "<tc><gray>Ta langue actuelle : <white>{current}"

# Moderation
moderation:
  mute-success: "<tc><white>{player} <green>a été muté pour <white>{duration}<green>. Raison : <white>{reason}"
  mute-received: "<tc><red>Tu as été réduit au silence pour <white>{duration}<red>. Raison : <white>{reason}"
  muted: "<tc><red>Tu es muté. Expiration dans : <white>{muted}"
  unmute-success: "<tc><white>{unmute_success} <green>a été démute."
  unmute-received: "<tc><green>Tu as été démuté. Tu peux parler à nouveau ! 🎤"
  kick-success: "<tc><white>{player} <green>a été kické. Raison : <white>{reason}"
  kick-message: "<tc><red>Tu as été kické !\n<gray>Raison : <white>{kick_message}"
  warn-success: "<tc><white>{player} <green>a reçu un avertissement. Raison : <white>{reason} <dark_gray>({warnings}/{maximum_warnings})"
  warn-received: "<tc><red>⚠ Avertissement reçu : <white>{reason} <red>({warnings}/{maximum_warnings})"
  history-header: "<tc><gold><bold>Historique de <white>{history_header}</bold></gold>"
  history-entry: "  <red>{action} <dark_gray>| <gray>{date} <dark_gray>| <white>Raison: {reason} <dark_gray>| <gray>Par: {moderator}"
  history-empty: "  <gray>Aucune sanction."
  ban-success: "<tc><white>{player} <green>a été banni. Raison : <white>{reason}"
  ban-message: "<tc><red>Tu as été banni !\n<gray>Raison : <white>{reason}\n<gray>Expiration : <white>{expiration}"
  warn-kick: "<tc><red>⚠ Tu as atteint {warn_kick} avertissements et as été expulsé."
  unban-success: "<tc><green>Le bannissement de <white>{unban_success}</white> a été levé."
  report-usage: "<tc><red>Usage : /report \\<joueur> \\<chat|cheat|behavior|other> [#message] [détails]"
  report-category: "<tc><red>Catégorie inconnue : chat, cheat, behavior ou other."
  report-created: "<tc><green>Signalement envoyé sous le numéro <white>#{report_created}</white>."
  report-failed: "<tc><red>Le signalement n'a pas pu être enregistré ou sa preuve a expiré."

communication:
  msg-usage: "<tc><red>Usage : /msg \\<joueur> \\<message>"
  reply-usage: "<tc><red>Usage : /reply \\<message>"
  ignore-usage: "<tc><red>Usage : /ignore \\<joueur>"
  global-usage: "<tc><red>Usage : /globalchat \\<message>"
  no-conversation: "<tc><red>Aucune conversation récente."
  sent: "<tc><gray>Message envoyé à <white>{sent}</white>."
  stored: "<tc><gray>{stored} est hors ligne : message conservé pendant 7 jours."
  blocked: "<tc><red>Ce joueur refuse les messages privés."
  private: "<light_purple>[MP]</light_purple> <white>{player}</white><gray> : {message}"
  private-offline: "<light_purple>[MP hors ligne]</light_purple> <white>{player}</white><gray> : {message}"
  ignored: "<tc><gray>Tu ignores maintenant <white>{ignored}</white>."
  unignored: "<tc><green>Tu n'ignores plus <white>{unignored}</white>."

# Formatted time
time:
  permanent: "Permanent"
  seconds: "{seconds}s"
  minutes: "{minutes}m"
  hours: "{hours}h"
  days: "{days}j"

# Commandes (usage)
