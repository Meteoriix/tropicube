services:
  mysql:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    environment:
      MYSQL_ROOT_PASSWORD: integration-root-only
      MYSQL_DATABASE: tropicube_integration
      MYSQL_USER: tropicube_test
      MYSQL_PASSWORD: integration-only
    ports: ["127.0.0.1::3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -e "SELECT 1" "$$MYSQL_DATABASE"']
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: [redis-server, --requirepass, integration-only, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=integration-only redis-cli ping']
      interval: 2s
      timeout: 5s
      retries: 30
