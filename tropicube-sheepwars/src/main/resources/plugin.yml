name: TropicubeSheepwars
version: 1.0.0
main: fr.tropicube.sheepwars.TropicubeSheepwars
api-version: '26.2'
description: "Tropicube - Plugin Sheepwars : mini-jeu"
authors: [ Tropicube-Team ]

depend:
  - TropicubeCore

softdepend: []

commands:
  sheepwars:
    description: "Affiche la cote et règle la progression SheepWars"
    usage: "/sheepwars [rank|mastery [a|b]|summary <public|team|private>]"
    aliases: [ swprofile ]

permissions:
  sheepwars.mapvote.weight.2:
    description: "Double le poids du vote de carte dans le scrutin court"
    default: false
