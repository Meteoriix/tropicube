# Configuration SheepWars

redis:
  host: localhost
  port: 6379
  password: ""

default-settings:
  # Minimum and maximum number of players
  min-players: 2
  max-players: 16
  # Automatic start when the minimum number of players is reached
  auto-start: true
  # Countdown and game duration (in seconds)
  countdown: 10
  game-duration: 600
  # Random Kits (ignores player selection)
  random-kits: false
  # Delay between sheep spawns (in seconds)
  sheep-give-delay: 15
  # Map vote: true = all vote, false = host chooses
  map-vote-enabled: true
  # Relative spawn weights of special sheep
  sheep-probabilities:
    boarding: 8
    tnt: 10
    distort: 3
    darkness: 6
    searching: 7
    fire: 8
    poison: 6
    swap: 7
    meteor: 4
    healing: 10
    lightning: 8
    gravity: 5
    mecha: 3
    strength: 9
    fragmentation: 6

custom-game-default-settings:
  # A custom game waits by default for its host to manually launch
  auto-start: false

# Glowing wool targets placed between the two team bases for each map.
team-powerups:
  enabled: true
  respawn-seconds: 45
  hit-radius: 0.85
  effects:
    healing:
      weight: 35
      health: 6
    poison-arrows:
      weight: 35
      arrow-count: 3
      duration-seconds: 5
      amplifier: 0
    speed:
      weight: 30
      duration-seconds: 8
      amplifier: 0

# Public queue rules. A ranked match only starts at its exact capacity.
competitive:
  role-limits:
    4v4:
      dps: 2
      tank: 1
      support: 1
    8v8:
      dps: 4
      tank: 2
      support: 2
# Validated gameplay tuning. Durations are expressed in seconds and damage/health in HP.
gameplay-balance:
  pvp:
    legacy-attack-speed: 1024
    wooden-sword-damage: 5.0
    stone-sword-damage: 6.0
    bow-damage-multiplier: 0.85
    knockback-horizontal: 0.4
    sprint-knockback-horizontal: 0.8
    knockback-vertical: 0.4
  global:
    max-stored-sheep: 5
    underdog-sheep-per-missing-player: 3
    underdog-max-per-player: 2
    countdown-sheep-health: 20
    breeder-sheep-health: 30
    countdown-seconds: 1.5
  kits:
    dps-sheep-damage-multiplier: 1.20
    tank-health: 24
    tank-knockback-resistance: 0.50
    normal-fall-damage-multiplier: 0.50
    tank-fall-damage-multiplier: 0.35
    medic-regeneration-seconds: 4
    medic-regeneration-amplifier: 0
    medic-cooldown-seconds: 3
    strength-damage-multiplier: 1.20
  sheep:
    tnt:
      block-power: 3.5
      radius: 6.5
      damage: 9
    fire:
      radius: 5
      fire-seconds: 4
      block-power: 1.5
      damage: 4
    poison:
      radius: 3.5
      duration-seconds: 4
      direct-damage: 0.25
      damage-period-ticks: 10
      poison-amplifier: 1
    darkness:
      radius: 5
      duration-seconds: 4
      slowness-amplifier: 1
      mining-fatigue-amplifier: 0
      blindness-amplifier: 0
    distort:
      radius: 4
      duration-seconds: 3
      waves-period-ticks: 10
      blocks-per-wave: 12
    searching:
      scan-radius: 12
      scan-seconds: 6
      pursuit-seconds: 6
      pursuit-speed: 1.4
      block-power: 2.5
      radius: 5
      damage: 8
    meteor:
      impact-block-power: 1.5
      impact-radius: 4
      impact-damage: 4
      projectile-count: 4
      projectile-spread: 5
      projectile-period-ticks: 8
      projectile-block-power: 2
      projectile-radius: 3.5
      projectile-damage: 4
    healing:
      radius: 5
      duration-seconds: 6
      pulse-period-ticks: 25
      pulse-heal: 2
    lightning:
      radius: 10
      targets: 3
      damage: 4
    gravity:
      pull-radius: 7
      pull-seconds: 0.75
      pull-speed: 0.35
      launch-radius: 5.5
      launch-speed: 1.1
    mecha:
      health: 50
      lifespan-seconds: 20
      scan-radius: 15
      attack-damage: 4
      attack-knockback: 1.2
    strength:
      radius: 5
      duration-seconds: 7
      refresh-period-ticks: 20
    fragmentation:
      fragments: 4
      central-block-power: 0.75
      central-radius: 2
      central-damage: 3
      fragment-block-power: 1.5
      fragment-radius: 3.5
      fragment-damage: 4
      total-damage-cap: 11


force-settings:
  # Disabled class IDs (ex: ["DPS", "SUPPORT"])
  classes-disabled: [ ]
  # Disabled kit IDs (ex: ["DPS_BOW", "TANK_HEARTS"])
  kits-disabled: [ ]
  # Disabled special sheep types (ex: ["TNT", "METEOR"])
  sheep-disabled: [ ]

# Rentals & Arenas on the map
# Spawns are automatically saved under spawns.red.spawn1, spawn2, ... (max 8 per team)
locations:
  world:
  lobby:
    void_limit:
  map_12345:
    name: "Map 12345"
    enabled: true
    void_limit: 100
    hazards:
      void-kill-enabled: true
      water-poison:
        enabled: false
        duration-ticks: 20
        amplifier: 0
    # Candidate centers for the single floating target (target1, target2, ...).
    powerups:
    spawns:
      red:
      blue:
  map_678910:
    name: "Map 678910"
    enabled: false
    void_limit: 100
    hazards:
      void-kill-enabled: true
      water-poison:
        enabled: false
        duration-ticks: 20
        amplifier: 0
    powerups:
    spawns:
      red:
      blue:
